name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Verify tag matches Version.current
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/.*static let current = "\([^"]*\)".*/\1/p' Sources/class-generator/Version.swift)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "$source_version" ]]; then
            echo "::error::Could not read Version.current from Sources/class-generator/Version.swift."
            exit 1
          fi

          if [[ "$source_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version.current ($source_version)."
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Package release
        run: Scripts/package-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/*.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
